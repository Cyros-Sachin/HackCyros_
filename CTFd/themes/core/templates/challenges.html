{% extends "base.html" %}

{% block content %}
<div class="challenge-header">
  <div class="container">
    <h1 class="page-title">Challenges</h1>
    <p class="page-sub">Select a target and deploy your solution</p>
  </div>
</div>


<div class="container">
  <div class="row">
    <div class="col-md-12">
      {% include "components/errors.html" %}
    </div>
  </div>

  <div x-data="ChallengeBoard" @load-challenges.window="loadChallenges()"
    @load-challenge.window="loadChallenge($event.detail)">
    <div x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
      x-html="$store.challenge.data.view"></div>

    <div x-show="!loaded">
      <div class="min-vh-50 d-flex align-items-center">
        <div class="text-center w-100">
          <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
        </div>
      </div>
    </div>

    <div x-show="loaded">
      <template x-for="(category, idx) in getCategories()" :key="idx">
        <div class="pt-5">
          <div class="category-header">
            <h3 class="category-title" x-text="category"></h3>
          </div>


          <div class="category-challenges d-flex flex-column">
            <div class="challenges-row row">
              <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                <div class="col-sm-6 col-md-4 col-lg-3 my-3">
                  <button class="challenge-button btn btn-dark w-100 h-100" :class="[
                          c.solved_by_me ? 'challenge-solved' : '',
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];" :value="c.id" @click="loadChallenge(c.id)">

                    <div class="challenge-inner">
                      <p class="challenge-name" x-text="c.name"></p>
                      <div class="challenge-meta">
                        <span class="challenge-value" x-text="c.value + ' pts'"></span>
                        <span class="challenge-status" x-show="c.solved_by_me">Solved</span>
                      </div>
                    </div>

                  </button>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
<style>

/* ================= HEADER ================= */
.challenge-header {
  padding: 90px 0 55px !important;
  background:
    radial-gradient(circle at 20% 30%, rgba(0, 255, 56,0.08), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 255, 56,0.06), transparent 40%),
    linear-gradient(to bottom, #090909, #000) !important;
  border-bottom: 1px solid #001a06 !important;
  position: relative;
  overflow: hidden;
}

/* faint scan lines */
.challenge-header::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 255, 56,0.02),
    rgba(0, 255, 56,0.02) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
}

.page-title {
  font-size: 3rem !important;
  font-weight: 700 !important;
  color: #2eff5c !important;
  letter-spacing: 4px !important;
  text-shadow: 0 0 12px rgba(0, 255, 56,0.6);
  animation: flicker 3s infinite;
}

.page-sub {
  margin-top: 10px !important;
  color: #6aff8b !important;
  letter-spacing: 2px !important;
  font-size: 0.9rem !important;
  opacity: 0.8;
}


/* ================= CATEGORY ================= */
.category-title {
  font-size: 1.1rem !important;
  letter-spacing: 1px !important;
  color: #4dff74 !important;
  border-left: 3px solid #4dff74 !important;
  padding-left: 10px !important;
  text-transform: uppercase !important;
}

/* ================= CHALLENGE CARDS ================= */
.challenge-button {
  background: #141414 !important;
  border: 1px solid #265c32 !important;
  border-radius: 8px !important;
  padding: 18px !important;
  text-align: left !important;
  transition: all 0.25s ease !important;
  box-shadow: 0 0 0 1px rgba(60, 255, 103, 0.08) !important;
}

.challenge-button:hover {
  border-color: #4dff74 !important;
  transform: translateY(-4px) !important;
  box-shadow: 0 0 0 1px rgba(77, 255, 116, 0.3), 0 8px 18px rgba(0,0,0,0.5) !important;
}

.challenge-name {
  font-size: 1rem !important;
  font-weight: 500 !important;
  color: #e5e5e5 !important;
  margin-bottom: 12px !important;
}

.challenge-meta {
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
}

.challenge-value {
  font-size: 0.85rem !important;
  color: #aaa !important;
}

.challenge-status {
  font-size: 0.75rem !important;
  background: #1f2b1f !important;
  color: #6dff6d !important;
  padding: 3px 8px !important;
  border-radius: 4px !important;
}

.challenge-solved {
  background: #101610 !important;
  border-color: #3d6b3d !important;
  opacity: 0.9 !important;
}

/* WHOLE CHALLENGE MODAL */
#challenge-window .modal-content {
  background: radial-gradient(circle at top left, #001404, #000501) !important;
  border: 1px solid #22993c !important;
  box-shadow: 0 0 0 1px rgba(0, 255, 56, 0.15), 0 0 30px rgba(0, 255, 56,0.25) !important;
  color: #b3ffc4 !important;
}

/* TITLE */
#challenge-window .modal-title {
  color: #2eff5c !important;
  letter-spacing: 2px !important;
}

/* DESCRIPTION */
#challenge-window .modal-body {
  color: #99ffaf !important;
}

/* FLAG INPUT BOX */
#challenge-window input[type="text"] {
  background: #000a02 !important;
  border: 1px solid #2a8a3f !important;
  color: #4dff74 !important;
  font-family: monospace !important;
}

#challenge-window input[type="text"]:focus {
  border-color: #2ee86a !important;
  box-shadow: 0 0 10px #2ee86a !important;
}

/* SUBMIT BUTTON */
#challenge-window .btn-primary {
  background: linear-gradient(45deg, #008b1f, #00ff38) !important;
  border: none !important;
  letter-spacing: 1px;
}

#challenge-window .btn-primary:hover {
  background: linear-gradient(45deg, #00ff38, #4dff74) !important;
  box-shadow: 0 0 12px #2ee86a !important;
}

/* SOLVED STATE MESSAGE */
#challenge-window .alert-success {
  background: #001104 !important;
  border: 1px solid #00330b !important;
  color: #80ff9c !important;
}

/* HINTS */
#challenge-window details {
  background: rgba(0, 20, 4, 0.5) !important;
  border: 1px solid #267a38 !important;
  border-radius: 4px !important;
  padding: 10px 14px !important;
  margin-bottom: 8px !important;
}

#challenge-window details summary {
  outline: none;
  font-family: 'Share Tech Mono', monospace;
  letter-spacing: 1px;
}

#challenge-window details[open] summary {
  color: #fff !important;
  text-shadow: 0 0 6px #2ee86a;
}

/* TAG BADGES */
#challenge-window .challenge-tag {
  background: linear-gradient(45deg, #008b1f, #00ff38) !important;
}

</style>

{% endblock %}

{% block scripts %}
{{ Assets.js("assets/js/challenges.js") }}
{% endblock %}
