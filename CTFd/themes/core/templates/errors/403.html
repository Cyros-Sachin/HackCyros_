{% extends "base.html" %}

{% block content %}

<div class="container">
  <div class="error-scene">
    <div>
      <div class="error-code" data-code="403">403</div>
      <div class="error-title">{% trans %}Forbidden{% endtrans %}</div>
      <div class="error-sub">{{ error }}</div>
      <div class="error-sub">This timeline is sealed. Access denied by the Avengers Initiative.</div>
      <a href="{{ url_for('views.static_html', route='/') }}" class="error-home">Fall Back</a>
    </div>
  </div>
</div>

{% endblock %}
