{% extends "base.html" %}

{% block content %}

<div class="container">
  <div class="error-scene">
    <div>
      <div class="error-code" data-code="429">429</div>
      <div class="error-title">{% trans %}Too many requests{% endtrans %}</div>
      <div class="error-sub">{% trans %}Please slow down!{% endtrans %} — the timeline can't keep up with you.</div>
      <a href="{{ url_for('views.static_html', route='/') }}" class="error-home">Wait It Out</a>
    </div>
  </div>
</div>

{% endblock %}
