services:
  ctfd:
    build: .
    user: root
    restart: always
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .:/opt/CTFd:ro
    depends_on:
      - db
    networks:
        default:
        internal:

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - ctfd

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
        internal:
    # This command is required to set important mariadb defaults
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:4
    restart: always
    volumes:
    - .data/redis:/data
    networks:
        internal:

  possessed-pages-medium:
    build: ./cuj-ctf-2026/challenges/possessed-pages/medium/src
    restart: unless-stopped
    ports:
      - "8103:80"

  possessed-pages-hard:
    build: ./cuj-ctf-2026/challenges/possessed-pages/hard/src
    restart: unless-stopped
    ports:
      - "8104:80"

  possessed-pages-hard2:
    build: ./cuj-ctf-2026/challenges/possessed-pages/hard2/src
    restart: unless-stopped
    ports:
      - "8105:80"

  possessed-pages-impossible:
    build: ./cuj-ctf-2026/challenges/possessed-pages/impossible/src
    restart: unless-stopped
    ports:
      - "8106:80"

  possession-beginner:
    build: ./cuj-ctf-2026/challenges/possession/beginner/src
    restart: unless-stopped
    ports:
      - "9001:9001"

  possession-easy:
    build: ./cuj-ctf-2026/challenges/possession/easy/src
    restart: unless-stopped
    ports:
      - "9002:9002"

  possession-medium:
    build: ./cuj-ctf-2026/challenges/possession/medium/src
    restart: unless-stopped
    ports:
      - "9003:9003"

  final-exorcism:
    build: ./cuj-ctf-2026/challenges/final-exorcism/src
    restart: unless-stopped
    ports:
      - "9999:9999"

networks:
    default:
    internal:
        internal: true
